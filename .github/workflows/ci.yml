name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    name: Core checks and packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/blender/requirements-test.txt
      - run: python -m pip install -r tools/blender/requirements-test.txt
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: minima-minidapp
          path: artifacts/*.mds.zip
  browser:
    name: Browser (${{ matrix.project }})
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -- --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results-${{ matrix.project }}
          path: test-results/
  # Keep the original required check name; neither project can silently be skipped.
  validate:
    needs: [core, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require core and both browser projects
        env:
          CORE_RESULT: ${{ needs.core.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$CORE_RESULT" = success && test "$BROWSER_RESULT" = success

  rig-deformation-quality:
    # Accepted temporary art defects: functional validation above remains blocking.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/blender/requirements-test.txt
      - run: python -m pip install -r tools/blender/requirements-test.txt
      - name: Measure delivered GLB at every half-frame; require all quality gates
        run: python tools/blender/evaluate_skin.py --input assets/characters/minimorph/animation/minimorph_animated_v1.glb --semantic assets/characters/minimorph/animation/rework/semantic-weights.npz --report artifacts/rig-deformation.json --require-pass
      - name: Explain temporary art quality failure
        if: failure()
        run: echo "::warning::Temporary character art did not pass the strict deformation diagnostic. The 2x threshold is unchanged; functional integration is checked in validate. See rig-deformation-report and docs/temporary-playable-character.md."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rig-deformation-report
          path: artifacts/rig-deformation.json
