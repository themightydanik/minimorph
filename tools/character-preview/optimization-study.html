<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Minimorph isolated character optimization review</title>
    <style>
      html,
      body {
        margin: 0;
        background: #101a38;
        color: white;
        font: 13px system-ui;
      }
      #stage {
        position: relative;
        width: 100vw;
        height: 100dvh;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .label {
        position: absolute;
        top: 24px;
        padding: 10px 16px;
        background: #071121da;
        border: 1px solid #48f5dc55;
        border-radius: 10px;
        pointer-events: none;
      }
      #status {
        position: absolute;
        bottom: 16px;
        left: 20px;
        background: #071121da;
        padding: 8px 12px;
      }
      #left {
        left: 20px;
      }
      #right {
        right: 20px;
      }
      a {
        color: #48f5dc;
      }
      #controls {
        position: absolute;
        top: 80px;
        left: 20px;
        right: 20px;
        z-index: 4;
      }
      button {
        background: #132b49;
        color: white;
        border: 1px solid #48f5dc55;
        border-radius: 6px;
        padding: 8px;
        margin: 3px;
      }
      #manual-output {
        font-size: 10px;
        background: #071121dd;
        max-height: 160px;
        overflow: auto;
        white-space: pre-wrap;
      }
      .label {
        max-width: 43%;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas aria-label="Character optimization render-only review"></canvas>
      <div class="label" id="left"></div>
      <div class="label" id="right"></div>
      <div id="controls" hidden>
        <button data-variant="original">Original</button
        ><button data-variant="candidate">Candidate</button
        ><button data-count="1">1</button><button data-count="2">2</button
        ><button data-count="4">4</button><button data-count="8">8</button
        ><button id="measure">Measure frame cadence</button>
        <pre id="manual-output"></pre>
      </div>
      <div id="status">Loading isolated study…</div>
    </div>
    <script type="module" src="/optimization-study.ts"></script>
  </body>
</html>
